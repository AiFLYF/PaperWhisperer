# Query seeds for the retrieval labelling run.
#
# These are the *questions*, not the answers. A seed carries no ground truth:
# `tools/label_retrieval.py build` ranks candidate passages for it and a person
# (or an annotator whose draft a person then checks) decides which passages
# actually answer it. Writing the question is cheap; writing the answer is the
# work, and it is the part nobody should let a machine do.
#
# `language` / `kind` here are the seed's guess, shown to the annotator and
# overridable per query in the CLI (`l zh`, `k table`). They are recorded as
# `decision_source: assistant_draft` unless a person set them, because the plan
# requires the two axes counted separately and a mis-classified label quietly
# moves a row into the wrong bucket.
#
# Documents chosen to span the axes the gate asks for:
#   en/zh/mixed  x  prose/table/formula
# Four of the zh/mixed corpus PDFs parse into a *single* element under the
# legacy parser, so their Recall@K is not discriminating -- recorded per query
# in `note`, because a bucket that looks like a failure is sometimes just a
# document with one element in it.

schema: paperwhisperer-label-seeds/0.1
queries:
