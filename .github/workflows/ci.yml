name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The lock is what this job installs from, so uv is the installer. The
      # version is pinned to the one that generated uv.lock: uv re-serialises a
      # lock's environment markers between releases, and an action that quietly
      # moved to a newer uv could make `--locked` fail for a reason that has
      # nothing to do with this repository's dependencies.
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.10.11'
          python-version: '3.11'
          enable-cache: true

      - name: Install dependencies
        run: |
          # `--locked`, not `--frozen`: this fails when pyproject.toml and
          # uv.lock disagree, which is the property that makes the lock worth
          # having. `--frozen` would install a stale lock silently -- a
          # dependency added to pyproject.toml and never locked would install
          # nothing and say nothing, and the only evidence would be a test
          # failing much later for an unrelated-looking reason.
          #
          # `hosted` and `render` are required, not optional, for this job, for
          # the same reason the gates job gives about psycopg. The suite
          # exercises the numpy-backed vector accelerator and the pypdfium2 page
          # renderer, and without those two installed the tests FAIL rather than
          # skip -- a checkout that has simply never installed the extras reads
          # as a broken build, which is how six failures sat on this job. Both
          # are small wheels: no torch, no model download.
          #
          # `parse` is deliberately NOT here. docling pulls the torch chain
          # (hundreds of MB, and a model download on first use), and the tests
          # that need it skip instead -- see tests/test_ingestion_docling.py and
          # the docling exemption in tests/test_docling_serve_real.py.
          uv sync --locked --extra dev --extra hosted --extra render

      - name: Lint
        run: uv run --locked --no-sync python -m ruff check .

      - name: Test
        run: uv run --locked --no-sync python -m pytest tests/ -q --tb=short

  frontend:
    name: Frontend (module syntax + structure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # These check ongoing invariants, not the one-off migration diff. The
      # pre-split originals live in .parity/, which is intentionally not
      # committed, so `make parity` stays a local check.
      - name: Parse every ES module
        run: node --experimental-vm-modules tools/check_js_syntax.mjs templates/static/js

      - name: Check references, cascade order and import cycles
        run: python tools/check_frontend.py

  # T4.3: release gates in CI. Added alongside the two jobs above, not in
  # place of them -- lint, the full test suite and the front-end structure
  # checks are unchanged.
  gates:
    name: Release gates (T4.3)
    runs-on: ubuntu-latest
    # The Hosted tier, so the task-recovery gate exercises its PostgreSQL
    # contract instead of skipping it. The repository already knows this
    # variable (tests/test_jobs.py:PG_DSN_ENV) and already probes it safely:
    # `postgres_availability()` only dials out when the variable is set, and
    # any failure downgrades to a skip with a readable reason rather than an
    # error. A database that is slow to start therefore costs coverage, never
    # correctness.
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: paperwhisperer
          POSTGRES_PASSWORD: paperwhisperer
          POSTGRES_DB: paperwhisperer
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U paperwhisperer -d paperwhisperer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Matches docker-compose.yml's db service, so the same contract tests run
      # against the same database locally and in CI.
      PAPERWHISPERER_TEST_PG_DSN: >-
        postgresql://paperwhisperer:paperwhisperer@localhost:5432/paperwhisperer
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.10.11'
          python-version: '3.11'
          enable-cache: true

      - name: Install dependencies
        run: |
          # `hosted` is required, not optional, for this job: it carries
          # psycopg. Without the driver, tests/test_jobs.py::postgres_availability()
          # returns "驱动不可用" and every TestJobPostgres test skips -- the
          # service container would come up healthy, the DSN would be set, and
          # the recovery gate would quietly measure SQLite only while the job
          # comment claimed otherwise. A gate that reports less coverage than
          # it says is worse than one that reports none.
          uv sync --locked --extra dev --extra hosted

      # The gate's own tests, not the whole suite: `backend` already runs that.
      # These are the ones that prove each gate has a threshold, that the
      # threshold decides, and that a deliberately broken fixture goes red.
      - name: Gate definition and threshold tests
        run: uv run --locked --no-sync python -m pytest tests/test_release_gates.py -q --tb=short

      # Build rules, not release rules: only a gate that actually FAILED exits
      # non-zero here. On a clean clone three corpus gates SKIP (eval/corpus/ is
      # gitignored) and two are BLOCKED (no labelled set), and the run still
      # exits 0 with every one of those printed and counted separately.
      # `--release` is deliberately NOT run here -- it is a pre-release check on
      # a machine that has the corpus and the labels, and it is expected to
      # refuse today.
      - name: Release gates
        run: python -m eval.run_gates --out eval/reports

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gates-report
          path: eval/reports/release_gates.md
          if-no-files-found: ignore
